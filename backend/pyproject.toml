[project]
name = "agent-city"
version = "0.1.0"
description = "A living city of 50 LLM agents: study, interview, work, get promoted."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["app*"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"